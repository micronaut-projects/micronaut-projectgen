type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.oracle-cloud-sdk
displayName: Add Oracle Cloud Sdk dependency and link to README
recipeList:
  - io.micronaut.starter.feature.oracle-cloud-sdk.dependencies
  - io.micronaut.starter.feature.oracle-cloud-sdk.micronaut.documentation
  - io.micronaut.starter.feature.oracle-cloud-sdk.documentation.thirdparty
  - io.micronaut.starter.feature.oci-config-profile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.oracle-cloud-sdk.dependencies
displayName: Add Oracle Cloud Sdk dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.oraclecloud
      artifactId: micronaut-oraclecloud-sdk
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.oracle-cloud-sdk.micronaut.documentation
displayName: Append a link to Micronaut Oracle Sdk documentation
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://micronaut-projects.github.io/micronaut-oracle-cloud/latest/guide/
      appendNewline: true
      existingFileStrategy: Continue
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.oracle-cloud-sdk.documentation.thirdparty
displayName: Append a link to Oracle Sdk website
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://docs.cloud.oracle.com/en-us/iaas/Content/API/SDKDocs/javasdk.htm
      appendNewline: true
      existingFileStrategy: Continue
