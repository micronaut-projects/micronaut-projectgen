type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.micrometer-signalfx
displayName: Add Micrometer Signalfx dependency and configuration
recipeList:
  - io.micronaut.starter.feature.micrometer-signalfx.dependencies
  - io.micronaut.starter.feature.create-application-properties
  - io.micronaut.starter.feature.micrometer-signalfx.configuration
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.micrometer-signalfx.dependencies
displayName: Add Micrometer Signalfx dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.micrometer
      artifactId: micronaut-micrometer-registry-signalfx
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.micrometer-signalfx.configuration
displayName: Add Micrometer Signalfx configuration
preconditions:
  - io.micronaut.starter.openrewrite.recipes.FindApplicationProperties
recipeList:
  - org.openrewrite.properties.AddProperty:
      property: micronaut.metrics.export.signalfx.enabled
      value: true
  - org.openrewrite.properties.AddProperty:
      property: micronaut.metrics.export.signalfx.step
      value: PT1M
  - org.openrewrite.properties.AddProperty:
      property: micronaut.metrics.export.signalfx.accessToken
      value: ${SIGNALFX_API_TOKEN}

