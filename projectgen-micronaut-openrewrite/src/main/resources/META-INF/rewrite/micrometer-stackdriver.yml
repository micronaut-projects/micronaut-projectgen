type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.micrometer-stackdriver
displayName: Add Micrometer Stackdriver dependency and configuration
recipeList:
  - io.micronaut.starter.feature.micrometer-stackdriver.dependencies
  - io.micronaut.starter.feature.create-application-properties
  - io.micronaut.starter.feature.micrometer-stackdriver.configuration
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.micrometer-stackdriver.dependencies
displayName: Add Micrometer Stackdriver dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.micrometer
      artifactId: micronaut-micrometer-registry-stackdriver
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.micrometer-stackdriver.configuration
displayName: Add Micrometer Stackdriver configuration
preconditions:
  - io.micronaut.starter.openrewrite.recipes.FindApplicationProperties
recipeList:
  - org.openrewrite.properties.AddProperty:
      property: micronaut.metrics.export.stackdriver.enabled
      value: true
  - org.openrewrite.properties.AddProperty:
      property: micronaut.metrics.export.stackdriver.step
      value: PT1M
  - org.openrewrite.properties.AddProperty:
      property: micronaut.metrics.export.stackdriver.projectId
      value: ${STACKDRIVER_PROJECT_ID}

