type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.spring-web
displayName: Add Spring Web dependency
recipeList:
  - io.micronaut.starter.feature.spring-web.dependencies
  - io.micronaut.starter.feature.spring-web-annotation
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.spring-web.dependencies
displayName: Add Spring Boot dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: org.springframework.boot
      artifactId: spring-boot-starter-web
      configuration: implementation
      scope: compile
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut
      artifactId: micronaut-http-server
      configuration: implementation
      scope: compile
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.spring
      artifactId: micronaut-spring-web
      configuration: runtimeOnly
      scope: runtime
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.spring
      artifactId: micronaut-spring-web-annotation
      configuration: testAnnotationProcessor
      scope: test
