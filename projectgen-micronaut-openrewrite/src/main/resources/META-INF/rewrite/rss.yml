type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.rss
displayName: Add Rss dependency and link to README
recipeList:
  - io.micronaut.starter.feature.rss.dependencies
  - io.micronaut.starter.feature.rss.micronaut.documentation
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.rss.dependencies
displayName: Add Rss dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.rss
      artifactId: micronaut-rss
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.rss.micronaut.documentation
displayName: Append a link to Micronaut Rss documentation
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://micronaut-projects.github.io/micronaut-rss/latest/guide/index.html#whatsNew
      appendNewline: true
      existingFileStrategy: Continue
