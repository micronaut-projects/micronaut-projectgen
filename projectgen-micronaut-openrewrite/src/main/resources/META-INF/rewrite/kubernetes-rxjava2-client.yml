type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.kubernetes-rxjava2-client
displayName: Add Kubernetes Rxjava2 Client dependency and link to README
recipeList:
  - io.micronaut.starter.feature.kubernetes-rxjava2-client.dependencies
  - io.micronaut.starter.feature.kubernetes-rxjava2-client.micronaut.documentation
  - io.micronaut.starter.feature.kubernetes-rxjava2-client.documentation.thirdparty
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.kubernetes-rxjava2-client.dependencies
displayName: Add Kubernetes Rxjava2 Client dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.kubernetes
      artifactId: micronaut-kubernetes-client-rxjava2
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.kubernetes-rxjava2-client.micronaut.documentation
displayName: Append a link to Micronaut Kubernetes Rxjava2 Client documentation
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://micronaut-projects.github.io/micronaut-kubernetes/latest/guide/#kubernetes-client
      appendNewline: true
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.kubernetes-rxjava2-client.documentation.thirdparty
displayName: Append a link to Kubernetes Client website
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://github.com/kubernetes-client/java/wiki
      appendNewline: true
