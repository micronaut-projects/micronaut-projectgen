type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.tracing-opentelemetry-exporter-otlp
displayName: Add Tracing Opentelemetry Exporter OTLP dependency and configuration
recipeList:
  - io.micronaut.starter.feature.tracing-opentelemetry-exporter-otlp.dependencies
  - io.micronaut.starter.feature.tracing-opentelemetry-exporter-otlp.configuration
  - io.micronaut.starter.feature.opentelemetry.documentation.thirdparty
  - io.micronaut.starter.feature.opentelemetry.micronaut.documentation
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.tracing-opentelemetry-exporter-otlp.dependencies
displayName: Add Tracing Opentelemetry Exporter OTLP dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.opentelemetry
      artifactId: opentelemetry-exporter-otlp
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.tracing-opentelemetry-exporter-otlp.configuration
displayName: Add Tracing Opentelemetry Exporter OTLP configuration
preconditions:
  - io.micronaut.starter.openrewrite.recipes.FindApplicationProperties
recipeList:
  - org.openrewrite.properties.AddProperty:
      property: otel.traces.exporter
      value: otlp
