type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.micrometer-statsd
displayName: Add Micrometer Statsd dependency and configuration
recipeList:
  - io.micronaut.starter.feature.micrometer-statsd.dependencies
  - io.micronaut.starter.feature.micrometer-statsd.configuration
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.micrometer-statsd.dependencies
displayName: Add Micrometer Statsd dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.micrometer
      artifactId: micronaut-micrometer-registry-statsd
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.micrometer-statsd.configuration
displayName: Add Micrometer Statsd configuration
preconditions:
  - io.micronaut.starter.openrewrite.recipes.FindApplicationProperties
recipeList:
  - org.openrewrite.properties.AddProperty:
      property: micronaut.metrics.export.statsd.enabled
      value: true
  - org.openrewrite.properties.AddProperty:
      property: micronaut.metrics.export.statsd.step
      value: PT1M
  - org.openrewrite.properties.AddProperty:
      property: micronaut.metrics.export.statsd.flavor
      value: datalog
  - org.openrewrite.properties.AddProperty:
      property: micronaut.metrics.export.statsd.host
      value: localhost
  - org.openrewrite.properties.AddProperty:
      property: micronaut.metrics.export.statsd.port
      value: 8125

