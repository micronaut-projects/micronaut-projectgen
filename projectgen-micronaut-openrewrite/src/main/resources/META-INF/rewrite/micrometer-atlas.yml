type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.micrometer-atlas
displayName: Add Atlas dependency and configurations
recipeList:
  - io.micronaut.starter.feature.micrometer-atlas.dependencies
  - io.micronaut.starter.feature.micrometer-atlas.configurations
  - io.micronaut.starter.feature.micrometer-core.configurations
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.micrometer-atlas.dependencies
displayName: Add Atlas dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.micrometer
      artifactId: micronaut-micrometer-registry-atlas
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.micrometer-atlas.configurations
displayName: Add Atlas configurations
preconditions:
  - io.micronaut.starter.openrewrite.recipes.FindApplicationProperties
recipeList:
  - org.openrewrite.properties.AddProperty:
      property: micronaut.metrics.export.atlas.enabled
      value: true
  - org.openrewrite.properties.AddProperty:
      property: micronaut.metrics.export.atlas.uri
      value: http\://localhost\:7101/api/v1/publish
  - org.openrewrite.properties.AddProperty:
      property: micronaut.metrics.export.atlas.step
      value: PT1M

