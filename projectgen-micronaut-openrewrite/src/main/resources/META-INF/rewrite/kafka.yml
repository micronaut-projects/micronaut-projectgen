type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.kafka
displayName: Add Kafka dependency and link to README
recipeList:
  - io.micronaut.starter.feature.kafka.dependencies
  - io.micronaut.starter.feature.kafka.micronaut.documentation
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.kafka.dependencies
displayName: Add Kafka dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.kafka
      artifactId: micronaut-kafka
      configuration: implementation
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.kafka.micronaut.documentation
displayName: Append a link to Micronaut Kafka documentation
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://micronaut-projects.github.io/micronaut-kafka/latest/guide/index.html
      appendNewline: true
