type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.micrometer-elastic
displayName: Add Micrometer Elastic dependency and configuration
recipeList:
  - io.micronaut.starter.feature.micrometer-elastic.dependencies
  - io.micronaut.starter.feature.micrometer-elastic.configuration
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.micrometer-elastic.dependencies
displayName: Add Micrometer Elastic dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.micrometer
      artifactId: micronaut-micrometer-registry-elastic
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.micrometer-elastic.configuration
displayName: Add Micrometer Elastic configuration
preconditions:
  - io.micronaut.starter.openrewrite.recipes.FindApplicationProperties
recipeList:
  - org.openrewrite.properties.AddProperty:
      property: micronaut.metrics.export.elastic.enabled
      value: true
  - org.openrewrite.properties.AddProperty:
      property: micronaut.metrics.export.elastic.step
      value: PT1M

