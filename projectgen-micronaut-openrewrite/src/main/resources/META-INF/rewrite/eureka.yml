type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.eureka
displayName: Add Eureka dependencies and link to README
recipeList:
  - io.micronaut.starter.feature.create-application-properties
  - io.micronaut.starter.feature.eureka.configurations
  - io.micronaut.starter.feature.eureka.micronaut.documentation
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.eureka.configurations
displayName: Add Eureka Configuration
preconditions:
  - io.micronaut.starter.openrewrite.recipes.FindApplicationProperties
recipeList:
  - org.openrewrite.properties.AddProperty:
      property: eureka.client.defaultZone
      value: ${EUREKA_HOST\:localhost}:${EUREKA_PORT\:8761}
  - org.openrewrite.properties.AddProperty:
      property: eureka.client.registration.enabled
      value: true
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.eureka.micronaut.documentation
displayName: Add Micronaut Eureka Documentation
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://docs.micronaut.io/latest/guide/index.html#serviceDiscoveryEureka
      appendNewline: true
      existingFileStrategy: Continue
