type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.micrometer-influx
displayName: Add Micrometer Influx dependency and configuration
recipeList:
  - io.micronaut.starter.feature.micrometer-influx.dependencies
  - io.micronaut.starter.feature.micrometer-influx.configuration
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.micrometer-influx.dependencies
displayName: Add Micrometer Influx dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.micrometer
      artifactId: micronaut-micrometer-registry-influx
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.micrometer-influx.configuration
displayName: Add Micrometer Influx configuration
preconditions:
  - io.micronaut.starter.openrewrite.recipes.FindApplicationProperties
recipeList:
  - org.openrewrite.properties.AddProperty:
      property: micronaut.metrics.export.influx.enabled
      value: true
  - org.openrewrite.properties.AddProperty:
      property: micronaut.metrics.export.influx.step
      value: PT1M
  - org.openrewrite.properties.AddProperty:
      property: micronaut.metrics.enabled
      value: true

