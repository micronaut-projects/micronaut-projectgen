type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.knative-annotations
displayName: Add Knative Annotations Processor
recipeList:
  - io.micronaut.starter.feature.knative-annotations.maven
  - io.micronaut.starter.feature.knative-annotations.gradle
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.knative-annotations.maven
displayName: Add Knative Annotation to the Maven compiler plugin
recipeList:
  - org.openrewrite.maven.AddAnnotationProcessor:
      groupId: io.dekorate
      artifactId: knative-annotations
      version: ${dekorate.version}
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.knative-annotations.gradle
displayName: Add Knative Annotation dependency to a Gradle Build
recipeList:
  - org.openrewrite.gradle.AddDependency:
      groupId: io.dekorate
      artifactId: knative-annotations
      configuration: annotationProcessor
