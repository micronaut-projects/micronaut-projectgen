type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.oracle-cloud-atp
displayName: Add Oracle Cloud Atp dependency and link to README
recipeList:
  - io.micronaut.starter.feature.oracle-cloud-atp.dependencies
  - io.micronaut.starter.feature.oracle-cloud-atp.micronaut.documentation
  - io.micronaut.starter.feature.oracle-cloud-atp.documentation.thirdparty
  - io.micronaut.starter.feature.oracle-cloud-atp.configuration
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.oracle-cloud-atp.dependencies
displayName: Add Oracle Cloud Atp dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.oraclecloud
      artifactId: micronaut-oraclecloud-atp
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.oracle-cloud-atp.micronaut.documentation
displayName: Append a link to Micronaut Oracle Cloud Atp to README
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://micronaut-projects.github.io/micronaut-oracle-cloud/latest/guide/#_micronaut_oraclecloud_atp
      appendNewline: true
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.oracle-cloud-atp.documentation.thirdparty
displayName: Append a link to Oracle Cloud Atp website
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://www.oracle.com/autonomous-database/autonomous-transaction-processing/
      appendNewline: true
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.oracle-cloud-atp.configuration
displayName: Add Oracle Cloud Atp configuration
preconditions:
  - io.micronaut.starter.openrewrite.recipes.FindApplicationProperties
recipeList:
  - org.openrewrite.properties.AddProperty:
      property: datasources.default.ocid
      value: changeme
  - org.openrewrite.properties.AddProperty:
      property: datasources.default.walletPassword
      value: changeme
  - org.openrewrite.properties.AddProperty:
      property: oci.config.profile
      value: DEFAULT
