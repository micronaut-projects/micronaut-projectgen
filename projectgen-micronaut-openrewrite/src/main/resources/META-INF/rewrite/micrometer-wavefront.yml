type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.micrometer-wavefront
displayName: Add Micrometer Wavefront dependency and configuration
recipeList:
  - io.micronaut.starter.feature.micrometer-wavefront.dependencies
  - io.micronaut.starter.feature.micrometer-wavefront.configuration
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.micrometer-wavefront.dependencies
displayName: Add Micrometer Wavefront dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.micrometer
      artifactId: micronaut-micrometer-registry-wavefront
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.micrometer-wavefront.configuration
displayName: Add Micrometer Wavefront configuration
preconditions:
  - io.micronaut.starter.openrewrite.recipes.FindApplicationProperties
recipeList:
  - org.openrewrite.properties.AddProperty:
      property: micronaut.metrics.export.wavefront.enabled
      value: true
  - org.openrewrite.properties.AddProperty:
      property: micronaut.metrics.export.wavefront.step
      value: PT1M
  - org.openrewrite.properties.AddProperty:
      property: micronaut.metrics.enabled
      value: true
  - org.openrewrite.properties.AddProperty:
      property: micronaut.metrics.export.wavefront.apiToken
      value: ${WAVEFRONT_API_TOKEN}

