type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.eclipse-store-rest
displayName: Add EclipseStore Rest dependency and link to README
recipeList:
  - io.micronaut.starter.feature.eclipse-store-rest.dependencies
  - io.micronaut.starter.feature.eclipse-store-rest.micronaut.documentation
  - io.micronaut.starter.feature.eclipse-store-rest.documentation.thirdparty
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.eclipse-store-rest.dependencies
displayName: Add EclipseStore Rest dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.eclipsestore
      artifactId: micronaut-eclipsestore-rest
      configuration: implementation
      scope: provided
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.eclipse-store-rest.micronaut.documentation
displayName: Append a link to Micronaut EclipseStore Rest documentation
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://micronaut-projects.github.io/micronaut-eclipseStore/latest/guide/#rest
      appendNewline: true
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.eclipse-store-rest.documentation.thirdparty
displayName: Append a link to EclipseStore Rest website
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://docs.eclipsestore.io/manual/storage/rest-interface/index.html
      appendNewline: true
