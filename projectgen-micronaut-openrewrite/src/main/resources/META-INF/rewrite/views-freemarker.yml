type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.views-freemarker
displayName: Add FreeMaker Views dependency and link to README
recipeList:
  - io.micronaut.starter.feature.views-freemarker.dependencies
  - io.micronaut.starter.feature.views-freemarker.micronaut.documentation
  - io.micronaut.starter.feature.views-freemarker.documentation.thirdparty
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.views-freemarker.dependencies
displayName: Add FreeMaker Views dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.views
      artifactId: micronaut-views-freemarker
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.views-freemarker.micronaut.documentation
displayName: Append a link to Micronaut FreeMaker Views documentation
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://micronaut-projects.github.io/micronaut-views/latest/guide/index.html#freemarker
      appendNewline: true
      existingFileStrategy: Continue
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.views-freemarker.documentation.thirdparty
displayName: Append a link to FreeMaker website
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://freemarker.apache.org
      appendNewline: true
      existingFileStrategy: Continue
