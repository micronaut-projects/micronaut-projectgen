type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.vertx-pg-client
displayName: Add Vertx Pg Client dependency and configuration
recipeList:
  - io.micronaut.starter.feature.vertx-pg-client.dependencies
  - io.micronaut.starter.feature.vertx-pg-client.configuration
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.vertx-pg-client.dependencies
displayName: Add Vertx Pg Client dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.sql
      artifactId: micronaut-vertx-pg-client
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.vertx-pg-client.configuration
displayName: Add Vertx Pg Client configuration
preconditions:
  - io.micronaut.starter.openrewrite.recipes.FindApplicationProperties
recipeList:
  - org.openrewrite.properties.AddProperty:
      property: vertx.pg.client.host
      value: the-host
  - org.openrewrite.properties.AddProperty:
      property: vertx.pg.client.port
      value: 5432
  - org.openrewrite.properties.AddProperty:
      property: vertx.pg.client.database
      value: the-db
  - org.openrewrite.properties.AddProperty:
      property: vertx.pg.client.database.user
      value: user
  - org.openrewrite.properties.AddProperty:
      property: vertx.pg.client.database.password
      value: password
  - org.openrewrite.properties.AddProperty:
      property: vertx.pg.client.database.maxSiz
      value: 5
