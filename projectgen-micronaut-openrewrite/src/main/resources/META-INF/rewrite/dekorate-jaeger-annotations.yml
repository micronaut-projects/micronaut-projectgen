type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.jaeger-annotations
displayName: Add Jaeger Annotations Processor
recipeList:
  - io.micronaut.starter.feature.jaeger-annotations.maven
  - io.micronaut.starter.feature.jaeger-annotations.gradle
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.jaeger-annotations.maven
displayName: Add Jaeger Annotation to the Maven compiler plugin
recipeList:
  - org.openrewrite.maven.AddAnnotationProcessor:
      groupId: io.dekorate
      artifactId: jaeger-annotations
      version: ${dekorate.version}
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.jaeger-annotations.gradle
displayName: Add Jaeger Annotation dependency to a Gradle Build
recipeList:
  - org.openrewrite.gradle.AddDependency:
      groupId: io.dekorate
      artifactId: jaeger-annotations
      configuration: annotationProcessor
