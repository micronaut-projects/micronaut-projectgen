type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.jmx
displayName: Add Jmx dependency and link to README
recipeList:
  - io.micronaut.starter.feature.jmx.dependencies
  - io.micronaut.starter.feature.jmx.micronaut.documentation
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.jmx.dependencies
displayName: Add Jmx dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.jmx
      artifactId: micronaut-jmx
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.jmx.micronaut.documentation
displayName: Append a link to Micronaut Jmx documentation
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://micronaut-projects.github.io/micronaut-jmx/latest/guide/index.html
      appendNewline: true
