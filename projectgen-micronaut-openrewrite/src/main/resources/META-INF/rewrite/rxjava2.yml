type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.rxjava2
displayName: Add RxJava2 dependency and link to README
recipeList:
  - io.micronaut.starter.feature.rxjava2.dependencies
  - io.micronaut.starter.feature.rxjava2.micronaut.documentation
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.rxjava2.dependencies
displayName: Add RxJava2 dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.rxjava2
      artifactId: micronaut-rxjava2
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.rxjava2.micronaut.documentation
displayName: Append a link to Micronaut RxJava2 documentation
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://micronaut-projects.github.io/micronaut-rxjava2/snapshot/guide/index.html
      appendNewline: true
