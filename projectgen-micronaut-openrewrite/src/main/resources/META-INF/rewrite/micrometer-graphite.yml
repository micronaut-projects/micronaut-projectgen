type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.micrometer-graphite
displayName: Add Micrometer Graphite dependency and configuration
recipeList:
  - io.micronaut.starter.feature.micrometer-graphite.dependencies
  - io.micronaut.starter.feature.create-application-properties
  - io.micronaut.starter.feature.micrometer-graphite.configuration
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.micrometer-graphite.dependencies
displayName: Add Micrometer Graphite dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.micrometer
      artifactId: micronaut-micrometer-registry-graphite
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.micrometer-graphite.configuration
displayName: Add Micrometer Graphite configuration
preconditions:
  - io.micronaut.starter.openrewrite.recipes.FindApplicationProperties
recipeList:
  - org.openrewrite.properties.AddProperty:
      property: micronaut.metrics.export.graphite.host
      value: localhost
  - org.openrewrite.properties.AddProperty:
      property: micronaut.metrics.export.graphite.port
      value: 2004
  - org.openrewrite.properties.AddProperty:
      property: micronaut.metrics.export.graphite.enabled
      value: true
  - org.openrewrite.properties.AddProperty:
      property: micronaut.metrics.export.graphite.step
      value: PT1M
