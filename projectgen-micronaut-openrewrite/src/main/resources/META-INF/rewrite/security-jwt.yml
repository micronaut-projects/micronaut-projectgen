type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.security-jwt
displayName: Add Security Jwt dependency and link to README
recipeList:
  - io.micronaut.starter.feature.security-jwt.dependencies
  - io.micronaut.starter.feature.security-jwt.micronaut.documentation
  - io.micronaut.starter.feature.security-jwt.configuration
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.security-jwt.dependencies
displayName: Add Security Jwt dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.security
      artifactId: micronaut-security-jwt
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.security-jwt.micronaut.documentation
displayName: Append a link to Micronaut Security Jwt documentation
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://micronaut-projects.github.io/micronaut-security/latest/guide/index.html
      appendNewline: true
      existingFileStrategy: Continue
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.security-jwt.configuration
displayName: Add Security Jwt configuration
preconditions:
  - io.micronaut.starter.openrewrite.recipes.FindApplicationProperties
recipeList:
  - org.openrewrite.properties.AddProperty:
      property: micronaut.security.authentication
      value: bearer
