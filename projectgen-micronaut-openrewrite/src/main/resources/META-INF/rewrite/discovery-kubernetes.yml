type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.discovery-kubernetes
displayName: Add Discovery Kubernetes Dependency and a link to README
recipeList:
  - io.micronaut.starter.feature.discovery-kubernetes.dependencies
  - io.micronaut.starter.feature.discovery-kubernetes.documentation.micronaut
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.discovery-kubernetes.dependencies
displayName: Add Discovery Kubernetes Dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.kubernetes
      artifactId: micronaut-kubernetes-discovery-client
      configuration: implementation
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.discovery-kubernetes.documentation.micronaut
displayName: Append a link to Micronaut Discovery Kubernetes Documentation
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://micronaut-projects.github.io/micronaut-kubernetes/latest/guide/#service-discovery
      appendNewline: true
