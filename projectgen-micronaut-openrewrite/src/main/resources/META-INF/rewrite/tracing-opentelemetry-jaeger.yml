type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.tracing-opentelemetry-exporter-jaeger
displayName: Add Tracing Opentelemetry Exporter Jaeger dependency and configuration
recipeList:
  - io.micronaut.starter.feature.tracing-opentelemetry-exporter-jaeger.dependencies
  - io.micronaut.starter.feature.create-application-properties
  - io.micronaut.starter.feature.tracing-opentelemetry-exporter-jaeger.configuration
  - io.micronaut.starter.feature.tracing-opentelemetry-exporter-otlp
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.tracing-opentelemetry-exporter-jaeger.configuration
displayName: Add Tracing Opentelemetry Exporter Jaeger configuration
preconditions:
  - io.micronaut.starter.openrewrite.recipes.FindApplicationProperties
recipeList:
  - org.openrewrite.properties.AddProperty:
      property: otel.exporter.otlp.endpoint
      value: http://localhost:4317
