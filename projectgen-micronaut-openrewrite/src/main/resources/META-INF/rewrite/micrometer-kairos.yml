type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.micrometer-kairos
displayName: Add Micrometer Kairos dependency and configuration
recipeList:
  - io.micronaut.starter.feature.micrometer-kairos.dependencies
  - io.micronaut.starter.feature.micrometer-kairos.configuration
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.micrometer-kairos.dependencies
displayName: Add Micrometer Kairos dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.micrometer
      artifactId: micronaut-micrometer-registry-kairos
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.micrometer-kairos.configuration
displayName: Add Micrometer Kairos configuration
preconditions:
  - io.micronaut.starter.openrewrite.recipes.FindApplicationProperties
recipeList:
  - org.openrewrite.properties.AddProperty:
      property: micronaut.metrics.export.kairos.enabled
      value: true
  - org.openrewrite.properties.AddProperty:
      property: micronaut.metrics.export.kairos.step
      value: PT1M
  - org.openrewrite.properties.AddProperty:
      property: micronaut.metrics.enabled
      value: true

