type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.tracing-zipkin
displayName: Add Tracing Zipkin dependency and link to README
recipeList:
  - io.micronaut.starter.feature.tracing-zipkin.dependencies
  - io.micronaut.starter.feature.tracing-zipkin.configuration
  - io.micronaut.starter.feature.tracing-zipkin.micronaut.documentation
  - io.micronaut.starter.feature.tracing-zipkin.documentation.thirdparty
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.tracing-zipkin.dependencies
displayName: Add Tracing Zipkin dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.tracing
      artifactId: micronaut-tracing-brave-http
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.tracing-zipkin.configuration
displayName: Add Tracing Zipkin configuration
preconditions:
  - io.micronaut.starter.openrewrite.recipes.FindApplicationProperties
recipeList:
  - org.openrewrite.properties.AddProperty:
      property: tracing.zipkin.enabled
      value: true
  - org.openrewrite.properties.AddProperty:
      property: tracing.zipkin.sampler.probability
      value: 0.1
  - org.openrewrite.properties.AddProperty:
      property: tracing.zipkin.http.url
      value: http://localhost:9411
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.tracing-zipkin.micronaut.documentation
displayName: Append a link to Micronaut Tracing Zipkin documentation
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://micronaut-projects.github.io/micronaut-tracing/latest/guide/#zipkin
      appendNewline: true
      existingFileStrategy: Continue
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.tracing-zipkin.documentation.thirdparty
displayName: Append a link to Tracing Zipkin website
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://zipkin.io/
      appendNewline: true
      existingFileStrategy: Continue
