type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.spring-annotation
displayName: Add Spring Annotation Processor
recipeList:
  - io.micronaut.starter.feature.spring-annotation.maven
  - io.micronaut.starter.feature.spring-annotation.gradle
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.spring-annotation.maven
displayName: Add Spring Annotations Processor to the Maven compiler plugin
recipeList:
  - org.openrewrite.maven.AddAnnotationProcessor:
      groupId: io.micronaut.spring
      artifactId: micronaut-spring-annotation
      version: ${micronaut.spring.version}
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.spring-annotation.gradle
displayName: Add Spring Annotations Processor dependency to a Gradle Build
recipeList:
  - org.openrewrite.gradle.AddDependency:
      groupId: io.micronaut.spring
      artifactId: micronaut-spring-annotation
      configuration: annotationProcessor
