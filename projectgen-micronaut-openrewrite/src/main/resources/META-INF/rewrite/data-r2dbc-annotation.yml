type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.data-r2dbc-annotation.maven
displayName: Add Data R2dbc Annotation to the Maven compiler plugin
recipeList:
  - org.openrewrite.maven.AddAnnotationProcessor:
      groupId: io.micronaut.data
      artifactId: micronaut-data-processor
      version: ${micronaut.data.version}
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.data-r2dbc-annotation.gradle
displayName: Add Data R2dbc Annotation dependency to a Gradle Build
recipeList:
  - org.openrewrite.gradle.AddDependency:
      groupId: io.micronaut.data
      artifactId: micronaut-data-processor
      configuration: annotationProcessor
