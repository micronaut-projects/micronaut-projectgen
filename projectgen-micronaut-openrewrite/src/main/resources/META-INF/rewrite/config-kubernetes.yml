type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.config-kubernetes
displayName: Add Config Kubernetes dependency and link to README
recipeList:
  - io.micronaut.starter.feature.config-kubernetes.dependencies
  - io.micronaut.starter.feature.config-kubernetes.micronaut.documentation
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.config-kubernetes.dependencies
displayName: Add Config Kubernetes dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.kubernetes
      artifactId: micronaut-kubernetes-discovery-client
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.config-kubernetes.micronaut.documentation
displayName: Append a link to Micronaut Config Kubernetes documentation
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://micronaut-projects.github.io/micronaut-kubernetes/latest/guide/#config-client
      appendNewline: true
