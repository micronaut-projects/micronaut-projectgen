type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.micrometer-observation
displayName: Add Micrometer Observation dependency and configuration
recipeList:
  - io.micronaut.starter.feature.micrometer-observation.dependencies
  - io.micronaut.starter.feature.micrometer-observation.configuration
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.micrometer-observation.dependencies
displayName: Add Micrometer Observation dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.micrometer
      artifactId: micronaut-micrometer-observation
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.micrometer-observation.configuration
displayName: Add Micrometer Observation configuration
preconditions:
  - io.micronaut.starter.openrewrite.recipes.FindApplicationProperties
recipeList:
  - org.openrewrite.properties.AddProperty:
      property: micronaut.metrics.enabled
      value: true
