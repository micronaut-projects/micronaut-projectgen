type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.hibernate-jpa
displayName: Add Hibernate Jpa dependency and link to README
recipeList:
  - io.micronaut.starter.feature.hibernate-jpa.dependencies
  - io.micronaut.starter.feature.hibernate-jpa.micronaut.documentation
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.hibernate-jpa.dependencies
displayName: Add Hibernate Jpa dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.sql
      artifactId: micronaut-hibernate-jpa
      configuration: implementation
      scope: compile
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.data
      artifactId: micronaut-data-tx-hibernate
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.hibernate-jpa.micronaut.documentation
displayName: Append a link to Micronaut Hibernate Jpa documentation
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://micronaut-projects.github.io/micronaut-sql/latest/guide/index.html#hibernate
      appendNewline: true
