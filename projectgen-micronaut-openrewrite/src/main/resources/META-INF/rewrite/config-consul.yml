type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.config-consul
displayName: Add Config Consul dependency and link to README
recipeList:
  - io.micronaut.starter.feature.config-consul.dependencies
  - io.micronaut.starter.feature.config-consul.micronaut.documentation
  - io.micronaut.starter.feature.config-consul.documentation.thirdparty
  - io.micronaut.starter.feature.config-consul.configuration
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.config-consul.dependencies
displayName: Add Config Consul dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.discovery
      artifactId: micronaut-discovery-client
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.config-consul.micronaut.documentation
displayName: Append a link to Micronaut Config Consul documentation
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://docs.micronaut.io/latest/guide/index.html#distributedConfigurationConsul
      appendNewline: true
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.config-consul.documentation.thirdparty
displayName: Append a link to Consul Website
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://www.consul.io
      appendNewline: true
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.config-consul.configuration
displayName: Add Config Consul Configuration
preconditions:
  - io.micronaut.starter.openrewrite.recipes.FindBootstrapProperties
recipeList:
  - org.openrewrite.properties.AddProperty:
      property: micronaut.config-client.enabled
      value: true

