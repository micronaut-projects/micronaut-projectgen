type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.mqtt
displayName: Add Mqtt dependency and link to README
recipeList:
  - io.micronaut.starter.feature.mqtt.dependencies
  - io.micronaut.starter.feature.mqtt.micronaut.documentation
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.mqtt.dependencies
displayName: Add Mqtt dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.mqtt
      artifactId: micronaut-mqttv5
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.mqtt.micronaut.documentation
displayName: Append a link to Micronaut Mqtt documentation
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://micronaut-projects.github.io/micronaut-mqtt/latest/guide/index.html
      appendNewline: true

