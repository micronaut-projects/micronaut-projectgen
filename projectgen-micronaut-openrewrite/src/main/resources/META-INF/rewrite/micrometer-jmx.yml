type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.micrometer-jmx
displayName: Add Micrometer Jmx dependency and configuration
recipeList:
  - io.micronaut.starter.feature.micrometer-jmx.dependencies
  - io.micronaut.starter.feature.micrometer-jmx.configuration
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.micrometer-jmx.dependencies
displayName: Add Micrometer Jmx dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.micrometer
      artifactId: micronaut-micrometer-registry-jmx
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.micrometer-jmx.configuration
displayName: Add Micrometer Jmx configuration
preconditions:
  - io.micronaut.starter.openrewrite.recipes.FindApplicationProperties
recipeList:
  - org.openrewrite.properties.AddProperty:
      property: micronaut.metrics.export.jmx.enabled
      value: true
  - org.openrewrite.properties.AddProperty:
      property: micronaut.metrics.export.jmx.step
      value: PT1M
