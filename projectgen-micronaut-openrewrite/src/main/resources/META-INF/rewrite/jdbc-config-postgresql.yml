type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.jdbc-config-postgresql
displayName: Add Jdbc Postgresql configuration
recipeList:
  - io.micronaut.starter.feature.create-application-properties
  - io.micronaut.starter.feature.jdbc-config-postgresql.config
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.jdbc-config-postgresql.config
displayName: Add Jdbc Postgresql configuration
preconditions:
  - io.micronaut.starter.openrewrite.recipes.FindApplicationProperties
recipeList:
  - org.openrewrite.properties.AddProperty:
      property: datasources.default.db-type
      value: postgres
  - org.openrewrite.properties.AddProperty:
      property: datasources.default.driver-class-name
      value: org.postgresql.Driver

