name: io.micronaut.starter.feature.sourcegen-generator-annotation-kotlin.gradle
displayName: Adds SourceGen Generator annotation Processor dependency to a Gradle Build
recipeList:
  - org.openrewrite.gradle.AddDependency:
      groupId: io.micronaut.sourcegen
      artifactId: micronaut-sourcegen-generator-kotlin
      configuration: annotationProcessor
