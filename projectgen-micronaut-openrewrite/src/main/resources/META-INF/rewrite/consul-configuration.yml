type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.consul-configuration
displayName: Add Consul configuration
recipeList:
  - io.micronaut.starter.feature.create-application-properties
  - io.micronaut.starter.feature.consul-configuration.config
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.consul-configuration.config
displayName: Add Consul configuration
preconditions:
  - io.micronaut.starter.openrewrite.recipes.FindApplicationProperties
recipeList:
  - org.openrewrite.properties.AddProperty:
      property: consul.client.defaultZone
      value: ${CONSUL_HOST:localhost}:${CONSUL_PORT:8500}
