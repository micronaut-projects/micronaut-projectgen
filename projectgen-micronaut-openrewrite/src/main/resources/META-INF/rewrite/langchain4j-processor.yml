name: io.micronaut.starter.feature.langchain4j.processor.gradle
displayName: Adds Micronaut Langchain4j Processor dependency to a Gradle Build
recipeList:
  - org.openrewrite.gradle.AddDependency:
      groupId: io.micronaut.langchain4j
      artifactId: micronaut-langchain4j-processor
      configuration: annotationProcessor
