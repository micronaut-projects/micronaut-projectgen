name: io.micronaut.starter.feature.aop.documentation.thirdparty
displayName: Append a link to the AOP Website
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://docs.micronaut.io/latest/guide/index.html#aop
      appendNewline: true
      existingFileStrategy: Continue
