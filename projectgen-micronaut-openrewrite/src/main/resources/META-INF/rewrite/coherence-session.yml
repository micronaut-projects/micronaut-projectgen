type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.coherence-session
displayName: Add Coherence Session dependency and link to README
recipeList:
  - io.micronaut.starter.feature.coherence-session.dependencies
  - io.micronaut.starter.feature.coherence-session.micronaut.documentation
  - io.micronaut.starter.feature.coherence-docs
  - io.micronaut.starter.feature.coherence-session.configuration
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.coherence-session.dependencies
displayName: Add Coherence Session dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.coherence
      artifactId: micronaut-coherence-session
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.coherence-session.micronaut.documentation
displayName: Append a link to Micronaut Coherence Session documentation
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://micronaut-projects.github.io/micronaut-coherence/latest/guide/#coherenceHttpSessions
      appendNewline: true
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.coherence-session.configuration
displayName: Add Coherence Session Configuration
preconditions:
  - io.micronaut.starter.openrewrite.recipes.FindApplicationProperties
recipeList:
  - org.openrewrite.properties.AddProperty:
      property: micronaut.session.http.coherence.enabled
      value: true


