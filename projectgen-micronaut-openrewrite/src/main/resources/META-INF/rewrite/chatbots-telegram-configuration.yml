type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.chatbots-telegram-configuration
displayName: Add Chatbots Telegram configuration
recipeList:
  - io.micronaut.starter.feature.create-application-properties
  - io.micronaut.starter.feature.chatbots-telegram-configuration.config
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.chatbots-telegram-configuration.config
displayName: Add Chatbots Telegram configuration
preconditions:
  - io.micronaut.starter.openrewrite.recipes.FindApplicationProperties
recipeList:
  - org.openrewrite.properties.AddProperty:
      property: micronaut.chatbots.folder
      value: botcommands
  - org.openrewrite.properties.AddProperty:
      property: micronaut.chatbots.telegram.bots.example.token
      value: WEBHOOK_TOKEN
  - org.openrewrite.properties.AddProperty:
      property: micronaut.chatbots.telegram.bots.example.at-username
      value: "@MyMicronautExampleBot"
