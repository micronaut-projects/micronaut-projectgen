type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.microstream-cache
displayName: Add Microstream Cache dependency and link to README
recipeList:
  - io.micronaut.starter.feature.microstream-cache.dependencies
  - io.micronaut.starter.feature.create-application-properties
  - io.micronaut.starter.feature.microstream-cache.configurations
  - io.micronaut.starter.feature.microstream-cache.micronaut.documentation
  - io.micronaut.starter.feature.microstream-cache.documentation.thirdparty
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.microstream-cache.dependencies
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.microstream
      artifactId: micronaut-microstream-cache
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.microstream-cache.configurations
displayName: Add Microstream Cache configuration
preconditions:
  - io.micronaut.starter.openrewrite.recipes.FindApplicationProperties
recipeList:
  - org.openrewrite.properties.AddProperty:
      property: microstream.cache.my-cache.key-type
      value: java.lang.Integer
  - org.openrewrite.properties.AddProperty:
      property: microstream.cache.my-cache.value-type
      value: java.lang.String
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.microstream-cache.micronaut.documentation
displayName: Append a link to Micronaut Microstream Cache documentation
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://micronaut-projects.github.io/micronaut-microstream/latest/guide/#cache
      appendNewline: true
      existingFileStrategy: Continue
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.microstream-cache.documentation.thirdparty
displayName: Append a link to Microstream Cache website
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://docs.microstream.one/manual/cache/index.html
      appendNewline: true
      existingFileStrategy: Continue
