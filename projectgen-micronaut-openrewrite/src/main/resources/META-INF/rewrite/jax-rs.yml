type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.jax-rs
displayName: Add JaxRs dependency and a link to README
recipeList:
  - io.micronaut.starter.feature.jax-rs.dependencies
  - io.micronaut.starter.feature.jax-rs.micronaut.documentation
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.jax-rs.dependencies
displayName: Add JaxRs dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.jaxrs
      artifactId: micronaut-jaxrs-server
      configuration: implementation
      scope: compile
  - org.openrewrite.gradle.AddDependency:
      groupId: io.micronaut.jaxrs
      artifactId: micronaut-jaxrs-processor
      configuration: annotationProcessor
  - org.openrewrite.maven.AddAnnotationProcessor:
      groupId: io.micronaut.jaxrs
      artifactId: micronaut-jaxrs-processor
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.jax-rs.micronaut.documentation
displayName: Append a link to micronaut JaxRs documentation
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://micronaut-projects.github.io/micronaut-jaxrs/latest/guide/index.html
      appendNewline: true
