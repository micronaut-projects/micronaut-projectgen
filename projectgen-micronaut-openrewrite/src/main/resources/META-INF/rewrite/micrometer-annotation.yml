type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.micrometer-annotation
displayName: Add Micrometer Annotation dependency and configuration
recipeList:
  - io.micronaut.starter.feature.micrometer-annotation.dependencies
  - io.micronaut.starter.feature.micrometer-annotation.configuration
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.micrometer-annotation.dependencies
displayName: Add Micrometer Annotation dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.micrometer
      artifactId: micronaut-micrometer-annotation
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.micrometer-annotation.configuration
displayName: Add Micrometer Annotation configuration
preconditions:
  - io.micronaut.starter.openrewrite.recipes.FindApplicationProperties
recipeList:
  - org.openrewrite.properties.AddProperty:
      property: micronaut.metrics.enabled
      value: true
