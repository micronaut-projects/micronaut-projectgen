type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.object-storage-aws.dependencies
displayName: Add Object Storage aws dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.objectstorage
      artifactId: micronaut-object-storage-aws
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.object-storage-aws.documentation.thirdparty
displayName: Append a link to aws Website
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://aws.amazon.com/s3/
      appendNewline: true
