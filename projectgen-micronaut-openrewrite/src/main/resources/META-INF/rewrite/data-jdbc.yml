type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.data-jdbc
displayName: Add Data Jdbc dependency and link to README
recipeList:
  - io.micronaut.starter.feature.data-jdbc.dependencies
  - io.micronaut.starter.feature.data-processor-annotation
  - io.micronaut.starter.feature.data-jdbc.micronaut.documentation
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.data-jdbc.dependencies
displayName: Add Data Jdbc dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.data
      artifactId: micronaut-data-jdbc
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.data-jdbc.micronaut.documentation
displayName: Append a link to Micronaut Data Jdbc documentation
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://micronaut-projects.github.io/micronaut-data/latest/guide/index.html#jdbc
      appendNewline: true
      existingFileStrategy: Continue
