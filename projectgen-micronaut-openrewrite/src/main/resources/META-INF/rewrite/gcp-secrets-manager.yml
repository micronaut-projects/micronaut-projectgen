type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.gcp-secrets-manager
displayName: Add Gcp Secrets Manager dependency and link to README
recipeList:
  - io.micronaut.starter.feature.gcp-secrets-manager.dependencies
  - io.micronaut.starter.feature.gcp-secrets-manager.micronaut.documentation
  - io.micronaut.starter.feature.gcp-secrets-manager.documentation.thirdparty
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.gcp-secrets-manager.dependencies
displayName: Add Gcp Secrets Manager dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.gcp
      artifactId: micronaut-gcp-secret-manager
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.gcp-secrets-manager.micronaut.documentation
displayName: Append a link to Micronaut Gcp Secrets Manager documentation
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://micronaut-projects.github.io/micronaut-gcp/latest/guide/#secretManager
      appendNewline: true
      existingFileStrategy: Continue
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.gcp-secrets-manager.documentation.thirdparty
displayName: Append a link to Gcp Secrets Manager Website
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://cloud.google.com/secret-manager
      appendNewline: true
      existingFileStrategy: Continue
