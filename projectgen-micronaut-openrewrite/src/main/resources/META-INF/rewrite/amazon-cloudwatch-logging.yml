type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.amazon-cloudwatch-logging
displayName: Add Amazon CloudWatch Logging dependency and link to README
recipeList:
  - io.micronaut.starter.feature.amazon-cloudwatch-logging.dependencies
  - io.micronaut.starter.feature.amazon-cloudwatch-logging.micronaut.documentation
  - io.micronaut.starter.feature.amazon-cloudwatch-logging.documentation.thirdparty
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.amazon-cloudwatch-logging.dependencies
displayName: Add Amazon CloudWatch Logging dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.aws
      artifactId: micronaut-aws-cloudwatch-logging
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.amazon-cloudwatch-logging.micronaut.documentation
displayName: Append a link to Micronaut Amazon CloudWatch Logging documentation
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://micronaut-projects.github.io/micronaut-aws/latest/guide/#cloudWatchLogging
      appendNewline: true
      existingFileStrategy: Continue
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.amazon-cloudwatch-logging.documentation.thirdparty
displayName: Append a link to Amazon CloudWatch Logging website
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/WhatIsCloudWatchLogs.html
      appendNewline: true
      existingFileStrategy: Continue
