type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.elasticsearch
displayName: Add ElasticSearch dependency and link to README
recipeList:
  - io.micronaut.starter.feature.elasticsearch.dependencies
  - io.micronaut.starter.feature.elasticsearch.configuration
  - io.micronaut.starter.feature.elasticsearch.micronaut.documentation
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.elasticsearch.dependencies
displayName: Add ElasticSearch dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.elasticsearch
      artifactId: micronaut-elasticsearch
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.elasticsearch.configuration
displayName: Add ElasticSearch configuration
preconditions:
  - io.micronaut.starter.openrewrite.recipes.FindApplicationProperties
recipeList:
  - org.openrewrite.properties.AddProperty:
      property: elasticsearch.httpHosts
      value: http://localhost:9200,http://127.0.0.2:9200
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.elasticsearch.micronaut.documentation
displayName: Append a link to Micronaut ElasticSearch documentation
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://micronaut-projects.github.io/micronaut-elasticsearch/latest/guide/index.html
      appendNewline: true
