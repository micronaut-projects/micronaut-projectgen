type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.redis-lettuce
displayName: Add Redis Lettuce dependency and Configuration
recipeList:
  - io.micronaut.starter.feature.redis-lettuce.dependencies
  - io.micronaut.starter.feature.create-application-properties
  - io.micronaut.starter.feature.redis-lettuce.configuration
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.redis-lettuce.dependencies
displayName: Add Redis Lettuce dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.redis
      artifactId: micronaut-redis-lettuce
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.redis-lettuce.configuration
displayName: Add Redis Lettuce configuration
preconditions:
  - io.micronaut.starter.openrewrite.recipes.FindApplicationProperties
recipeList:
  - org.openrewrite.properties.AddProperty:
      property: redis.uri
      value: redis://localhost
