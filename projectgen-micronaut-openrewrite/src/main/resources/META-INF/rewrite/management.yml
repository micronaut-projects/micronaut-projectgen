type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.management
displayName: Add Management dependency and link to README
recipeList:
  - io.micronaut.starter.feature.management.dependencies
  - io.micronaut.starter.feature.management.micronaut.documentation
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.management.dependencies
displayName: Add Management dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut
      artifactId: micronaut-management
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.management.micronaut.documentation
displayName: Append a link to Micronaut Management Documentation
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://docs.micronaut.io/latest/guide/index.html#management
      appendNewline: true
      existingFileStrategy: Continue
