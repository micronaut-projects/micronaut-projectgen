type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.tracing-opentelemetry-exporter-logging
displayName: Add Tracing Opentelemetry Exporter Logging dependency and configuration
recipeList:
  - io.micronaut.starter.feature.tracing-opentelemetry-exporter-logging.dependencies
  - io.micronaut.starter.feature.tracing-opentelemetry-exporter-logging.configuration
  - io.micronaut.starter.feature.tracing-opentelemetry-exporter-logging.micronaut.documentation
  - io.micronaut.starter.feature.tracing-opentelemetry-exporter-logging.documentation.thirdparty
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.tracing-opentelemetry-exporter-logging.dependencies
displayName: Add Tracing Opentelemetry Exporter Logging dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.opentelemetry
      artifactId: opentelemetry-exporter-logging
      configuration: implementation
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.tracing-opentelemetry-exporter-logging.configuration
displayName: Add Tracing Opentelemetry Exporter Logging configuration
preconditions:
  - io.micronaut.starter.openrewrite.recipes.FindApplicationProperties
recipeList:
  - org.openrewrite.properties.AddProperty:
      property: otel.traces.exporter
      value: logging
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.tracing-opentelemetry-exporter-logging.micronaut.documentation
displayName: Append a link to micronaut opentelemetry documentation
recipeList:
  - io.micronaut.starter.feature.opentelemetry.micronaut.documentation
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.tracing-opentelemetry-exporter-logging.documentation.thirdparty
displayName: Append a link to opentelemetry Website
recipeList:
  - io.micronaut.starter.feature.opentelemetry.documentation.thirdparty

