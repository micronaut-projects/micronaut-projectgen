type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.coherence-data
displayName: Add Coherence Data dependency and link to README
recipeList:
  - io.micronaut.starter.feature.coherence-data.dependencies
  - io.micronaut.starter.feature.coherence-data.micronaut.documentation
  - io.micronaut.starter.feature.coherence-docs
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.coherence-data.dependencies
displayName: Add Coherence Data dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.coherence
      artifactId: micronaut-coherence-data
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.coherence-data.micronaut.documentation
displayName: Append a link to Micronaut Coherence Data documentation
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://micronaut-projects.github.io/micronaut-coherence/latest/guide/#repository
      appendNewline: true


