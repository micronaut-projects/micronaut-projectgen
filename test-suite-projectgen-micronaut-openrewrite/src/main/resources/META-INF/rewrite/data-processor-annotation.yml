type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.data-processor-annotation.maven
displayName: Add Data Processor Annotation Processor for maven
recipeList:
  - org.openrewrite.maven.AddAnnotationProcessor:
      groupId: io.micronaut.data
      artifactId: micronaut-data-processor
      version: ${micronaut.data.version}
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.data-processor-annotation.gradle
displayName: Add Data Processor Annotation Processor for gradle
recipeList:
  - org.openrewrite.gradle.AddDependency:
      groupId: io.micronaut.data
      artifactId: micronaut-data-processor
      configuration: annotationProcessor
