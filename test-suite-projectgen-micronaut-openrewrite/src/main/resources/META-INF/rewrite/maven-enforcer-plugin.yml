type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.maven-enforcer-plugin.plugin
displayName: Add Maven Enforcer Plugin
recipeList:
  - org.openrewrite.maven.AddPlugin:
      groupId: org.apache.maven.plugins
      artifactId: maven-enforcer-plugin
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.maven-enforcer-plugin.documentation.thirdparty
displayName: Append a link to Maven Enforcer Plugin documentation
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://maven.apache.org/enforcer/maven-enforcer-plugin/
      appendNewline: true
      existingFileStrategy: Continue
