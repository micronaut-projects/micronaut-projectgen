type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.maven-enforcer-plugin
displayName: Add Maven Enforcer Plugin and link to README
recipeList:
  - io.micronaut.starter.feature.maven-enforcer-plugin.plugin
