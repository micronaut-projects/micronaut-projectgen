type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.kubernetes-reactor-client
displayName: Add Kubernetes Reactor Client dependency and link to README
recipeList:
  - io.micronaut.starter.feature.kubernetes-reactor-client.dependencies
  - io.micronaut.starter.feature.kubernetes-reactor-client.micronaut.documentation
  - io.micronaut.starter.feature.kubernetes-client-docs
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.kubernetes-reactor-client.dependencies
displayName: Add Kubernetes Reactor Client dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.kubernetes
      artifactId: micronaut-kubernetes-client-reactor
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.kubernetes-reactor-client.micronaut.documentation
displayName: Append a link to Micronaut Kubernetes Reactor Client documentation
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://micronaut-projects.github.io/micronaut-kubernetes/latest/guide/#kubernetes-client
      appendNewline: true

