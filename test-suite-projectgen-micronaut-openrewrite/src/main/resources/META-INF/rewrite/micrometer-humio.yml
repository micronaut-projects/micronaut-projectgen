type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.micrometer-humio
displayName: Add Micrometer Humio dependency and configuration
recipeList:
  - io.micronaut.starter.feature.micrometer-humio.dependencies
  - io.micronaut.starter.feature.create-application-properties
  - io.micronaut.starter.feature.micrometer-humio.configuration
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.micrometer-humio.dependencies
displayName: Add Micrometer Humio dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.micrometer
      artifactId: micronaut-micrometer-registry-humio
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.micrometer-humio.configuration
displayName: Add Micrometer Humio configuration
preconditions:
  - io.micronaut.starter.openrewrite.recipes.FindApplicationProperties
recipeList:
  - org.openrewrite.properties.AddProperty:
      property: micronaut.metrics.export.humio.enabled
      value: true
  - org.openrewrite.properties.AddProperty:
      property: micronaut.metrics.export.humio.step
      value: PT1M

