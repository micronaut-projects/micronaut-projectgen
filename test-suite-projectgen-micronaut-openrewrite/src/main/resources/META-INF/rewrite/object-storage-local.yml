displayName: Append a link to Micronaut Object Storage Local documentation
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://micronaut-projects.github.io/micronaut-object-storage/latest/guide/index.html#local
      appendNewline: true
