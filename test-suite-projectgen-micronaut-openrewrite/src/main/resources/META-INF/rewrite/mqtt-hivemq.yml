type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.mqtt-hivemq
displayName: Add Mqtt Hivemq dependency and link to README
recipeList:
  - io.micronaut.starter.feature.mqtt-hivemq.dependencies
  - io.micronaut.starter.feature.mqtt-hivemq.micronaut.documentation
  - io.micronaut.starter.feature.mqtt-hivemq.documentation.third
  - io.micronaut.starter.feature.mqtt-conf
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.mqtt-hivemq.dependencies
displayName: Add Mqtt Hivemq dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.mqtt
      artifactId: micronaut-mqtt-hivemq
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.mqtt-hivemq.micronaut.documentation
displayName: Append a link to Micronaut Mqtt Hivemq documentation
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://micronaut-projects.github.io/micronaut-mqtt/latest/guide/index.html#hiveMq
      appendNewline: true
      existingFileStrategy: Continue
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.mqtt-hivemq.documentation.third
displayName: Append a link to Mqtt Hivemq website
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://github.com/hivemq/hivemq-mqtt-client
      appendNewline: true
      existingFileStrategy: Continue
