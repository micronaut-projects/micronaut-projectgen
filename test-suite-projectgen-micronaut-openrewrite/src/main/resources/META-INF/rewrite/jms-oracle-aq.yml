type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.jms-oracle-aq
displayName: Add Jms Oracle Aq dependency and link to README
recipeList:
  - io.micronaut.starter.feature.jms-oracle-aq.dependencies
  - io.micronaut.starter.feature.micronaut-jms-docs
  - io.micronaut.starter.feature.jms-oracle-aq.documentation.thirdparty
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.jms-oracle-aq.dependencies
displayName: Add Jms Oracle Aq dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: javax.transaction
      artifactId: jta
      version: 1.1
      configuration: implementation
      scope: compile
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: com.oracle.database.messaging
      artifactId: aqapi
      version: 19.3.0.0
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.jms-oracle-aq.documentation.thirdparty
displayName: Append a link to Jms Oracle Aq website
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://docs.oracle.com/en/database/oracle/oracle-database/21/adque/aq-introduction.html
      appendNewline: true
      existingFileStrategy: Continue
