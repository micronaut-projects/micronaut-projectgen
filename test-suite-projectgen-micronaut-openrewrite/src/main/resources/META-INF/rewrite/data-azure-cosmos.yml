type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.data-azure-cosmos
displayName: Add Data Azure Cosmos dependency and link to README
recipeList:
  - io.micronaut.starter.feature.data-azure-cosmos.dependencies
  - io.micronaut.starter.feature.data-azure-cosmos.micronaut.documentation
  - io.micronaut.starter.feature.data-azure-cosmos.documentation.thirdparty
  - io.micronaut.starter.feature.create-application-properties
  - io.micronaut.starter.feature.data-azure-cosmos.configuration
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.data-azure-cosmos.dependencies
displayName: Add Data Azure Cosmos dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.data
      artifactId: micronaut-data-azure-cosmos
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.data-azure-cosmos.micronaut.documentation
displayName: Append a link to Micronaut Data Azure Cosmos documentation
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://micronaut-projects.github.io/micronaut-data/latest/guide/#azureCosmos
      appendNewline: true
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.data-azure-cosmos.documentation.thirdparty
displayName: Append a link to Data Azure Cosmos website
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://learn.microsoft.com/en-us/azure/cosmos-db/
      appendNewline: true
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.data-azure-cosmos.configuration
displayName: Add Data Azure Cosmos configuration
preconditions:
  - io.micronaut.starter.openrewrite.recipes.FindApplicationProperties
recipeList:
  - org.openrewrite.properties.AddProperty:
      property: azure.cosmos.consistency-level
      value: SESSION
  - org.openrewrite.properties.AddProperty:
      property: azure.cosmos.default-gateway-mode
      value: true
  - org.openrewrite.properties.AddProperty:
      property: azure.cosmos.endpoint-discovery-enabled
      value: false
  - org.openrewrite.properties.AddProperty:
      property: azure.cosmos.endpoint-discovery-enabled
      value: false
  - org.openrewrite.properties.AddProperty:
      property: azure.cosmos.database.database-name
      value: myDb
  - org.openrewrite.properties.AddProperty:
      property: azure.cosmos.database.update-policy
      value: NONE
