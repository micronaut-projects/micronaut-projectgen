type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.servicecatalog-annotations
displayName: Add Servicecatalog Annotations Processor
recipeList:
  - io.micronaut.starter.feature.servicecatalog-annotations.maven
  - io.micronaut.starter.feature.servicecatalog-annotations.gradle
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.servicecatalog-annotations.maven
displayName: Add Servicecatalog Annotation to the Maven compiler plugin
recipeList:
  - org.openrewrite.maven.AddAnnotationProcessor:
      groupId: io.dekorate
      artifactId: servicecatalog-annotations
      version: ${dekorate.version}
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.servicecatalog-annotations.gradle
displayName: Add Servicecatalog Annotation dependency to a Gradle Build
recipeList:
  - org.openrewrite.gradle.AddDependency:
      groupId: io.dekorate
      artifactId: servicecatalog-annotations
      configuration: annotationProcessor
