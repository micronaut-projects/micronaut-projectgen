type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.views-velocity
displayName: Add Velocity Views dependency and link to README
recipeList:
  - io.micronaut.starter.feature.views-velocity.dependencies
  - io.micronaut.starter.feature.views-velocity.micronaut.documentation
  - io.micronaut.starter.feature.views-velocity.documentation.thirdparty
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.views-velocity.dependencies
displayName: Add Velocity Views dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.views
      artifactId: micronaut-views-velocity
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.views-velocity.micronaut.documentation
displayName: Append a link to Micronaut Velocity Views documentation
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://micronaut-projects.github.io/micronaut-views/latest/guide/index.html#velocity
      appendNewline: true
      existingFileStrategy: Continue
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.views-velocity.documentation.thirdparty
displayName: Append a link to Velocity Views Website
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://velocity.apache.org
      appendNewline: true
      existingFileStrategy: Continue
