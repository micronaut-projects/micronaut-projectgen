name: io.micronaut.starter.feature.coherence-grpc-client.dependencies
displayName: Add Coherence Grpc Client dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.coherence
      artifactId: micronaut-coherence-grpc-client
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.coherence-grpc-client.micronaut.documentation
displayName: Append a link to Micronaut Coherence Grpc Client documentation
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://micronaut-projects.github.io/micronaut-coherence/latest/guide/#grpc
      appendNewline: true


