type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.discovery-consul
displayName: Add Discovery Consul Dependency and link to README
recipeList:
  - io.micronaut.starter.feature.create-application-properties
  - io.micronaut.starter.feature.discovery-consul.configuration
  - io.micronaut.starter.feature.discovery-consul.micronaut.documentation
  - io.micronaut.starter.feature.discovery-consul.documentation.thirdparty
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.discovery-consul.configuration
displayName: Add Discovery Consul Configuration
preconditions:
  - io.micronaut.starter.openrewrite.recipes.FindApplicationProperties
recipeList:
  - org.openrewrite.properties.AddProperty:
      property: consul.client.registration.enabled
      value: true
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.discovery-consul.micronaut.documentation
displayName: Append a link to Micronaut Discovery Consul documentation
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://docs.micronaut.io/latest/guide/index.html#serviceDiscoveryConsul
      appendNewline: true
      existingFileStrategy: Continue
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.discovery-consul.documentation.thirdparty
displayName: Append a link to Discovery Consul Website
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://www.consul.io
      appendNewline: true
      existingFileStrategy: Continue

