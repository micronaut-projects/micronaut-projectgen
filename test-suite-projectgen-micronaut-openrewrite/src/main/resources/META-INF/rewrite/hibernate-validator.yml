type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.hibernate-validator
displayName: Add Hibernate Validator dependency and link to README
recipeList:
  - io.micronaut.starter.feature.hibernate-validator.dependencies
  - io.micronaut.starter.feature.hibernate-validator.micronaut.documentation
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.hibernate-validator.dependencies
displayName: Add Hibernate Validator dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.beanvalidation
      artifactId: micronaut-hibernate-validator
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.hibernate-validator.micronaut.documentation
displayName: Append a link to Micronaut Hibernate Validator documentation
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://micronaut-projects.github.io/micronaut-hibernate-validator/latest/guide/index.html
      appendNewline: true
      existingFileStrategy: Continue
