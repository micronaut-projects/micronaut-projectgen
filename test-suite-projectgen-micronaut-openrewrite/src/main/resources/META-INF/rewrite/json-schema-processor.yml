name: io.micronaut.starter.feature.json-schema-processor.gradle
displayName: Add Json Schema Processor dependency to a Gradle Build
recipeList:
  - org.openrewrite.gradle.AddDependency:
      groupId: io.micronaut.jsonschema
      artifactId: micronaut-json-schema-processor
      configuration: annotationProcessor
