type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.security-oauth2
displayName: Add Security Oauth2 dependency and link to README
recipeList:
  - io.micronaut.starter.feature.security-oauth2.dependencies
  - io.micronaut.starter.feature.security-oauth2.micronaut.documentation
  - io.micronaut.starter.feature.security-oauth2.configuration
  - io.micronaut.starter.feature.security-oauth2.dev-configuration
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.security-oauth2.dependencies
displayName: Add Security Oauth2 dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.security
      artifactId: micronaut-security-oauth2
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.security-oauth2.micronaut.documentation
displayName: Append a link to Micronaut Security Oauth2 documentation
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://micronaut-projects.github.io/micronaut-security/latest/guide/index.html#oauth
      appendNewline: true
      existingFileStrategy: Continue
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.security-oauth2.configuration
displayName: Add Security Oauth2 configuration
preconditions:
  - io.micronaut.starter.openrewrite.recipes.FindApplicationProperties
recipeList:
  - org.openrewrite.properties.AddProperty:
      property: micronaut.security.authentication
      value: cookie
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.security-oauth2.dev-configuration
displayName: Add Security Oauth2 dev configuration
preconditions:
  - io.micronaut.starter.openrewrite.recipes.FindDevProperties
recipeList:
  - org.openrewrite.properties.AddProperty:
      property: micronaut.security.oauth2.clients.default.client-id
      value: ${OAUTH_CLIENT_ID\:XXX}
  - org.openrewrite.properties.AddProperty:
      property: micronaut.security.oauth2.clients.default.client-secret
      value: ${OAUTH_ISSUER}
