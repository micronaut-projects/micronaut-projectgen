type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.netflix-hystrix
displayName: Add Netflix Hystrix dependency and link to README
recipeList:
  - io.micronaut.starter.feature.netflix-hystrix.dependencies
  - io.micronaut.starter.feature.netflix-hystrix.configuration
  - io.micronaut.starter.feature.netflix-hystrix.micronaut.documentation
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.netflix-hystrix.dependencies
displayName: Add Netflix Hystrix dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.netflix
      artifactId: micronaut-netflix-hystrix
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.netflix-hystrix.configuration
displayName: Add netflix Hystrix configuration
preconditions:
  - io.micronaut.starter.openrewrite.recipes.FindApplicationProperties
recipeList:
  - org.openrewrite.properties.AddProperty:
      property: hystrix.stream.enabled
      value: false
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.netflix-hystrix.micronaut.documentation
displayName: Append a link to Micronaut Netflix Hystrix documentation
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://docs.micronaut.io/latest/guide/index.html#netflixHystrix
      appendNewline: true
      existingFileStrategy: Continue
