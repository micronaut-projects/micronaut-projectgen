type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.consul-configuration-bootstrap
displayName: Add Consul Bootstrap configuration
preconditions:
  - io.micronaut.starter.openrewrite.recipes.FindBootstrapProperties
recipeList:
  - org.openrewrite.properties.AddProperty:
      property: consul.client.defaultZone
      value: ${CONSUL_HOST:localhost}:${CONSUL_PORT:8500}
