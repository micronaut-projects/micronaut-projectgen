type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.views-handlebars
displayName: Add Handlebars Views dependency and a link to README
recipeList:
  - io.micronaut.starter.feature.views-handlebars.dependencies
  - io.micronaut.starter.feature.views-handlebars.micronaut.documentation
  - io.micronaut.starter.feature.views-handlebars.documentation.thirdparty
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.views-handlebars.dependencies
displayName: Add Handlebars Views dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.views
      artifactId: micronaut-views-handlebars
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.views-handlebars.micronaut.documentation
displayName: Append a link to Micronaut Handlebars Views documentation
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://micronaut-projects.github.io/micronaut-views/latest/guide/index.html#handlebars
      appendNewline: true
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.views-handlebars.documentation.thirdparty
displayName: Append a link to Handlebars Views website
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://jknack.github.io/handlebars.java/
      appendNewline: true
