type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.email-postmark
displayName: Add Micronaut Email Postmark dependency and link to README
recipeList:
  - io.micronaut.starter.feature.email-postmark.dependencies
  - io.micronaut.starter.feature.email-postmark.documentation.thirdparty
  - io.micronaut.starter.feature.email-postmark.documentation.micronaut
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.email-postmark.dependencies
displayName: Add Email-postmark dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.email
      artifactId: micronaut-email-postmark
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.email-postmark.documentation.micronaut
displayName: Append link to Micronaut Email Postmark documentation
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://micronaut-projects.github.io/micronaut-email/latest/guide/index.html#postmark
      appendNewline: true
      existingFileStrategy: Continue
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.email-postmark.documentation.thirdparty
displayName: Append link to the Email-postmark Website
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://postmarkapp.com
      appendNewline: true
      existingFileStrategy: Continue

