type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.sourcegen-generator
displayName: Add SourceGen Generator dependency and link to README
recipeList:
  - io.micronaut.starter.feature.sourcegen-generator.dependencies
  - io.micronaut.starter.feature.sourcegen-generator.micronaut.documentation
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.sourcegen-generator.dependencies
displayName: Add SourceGen Generator dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.sourcegen
      artifactId: micronaut-sourcegen-annotations
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.sourcegen-generator.micronaut.documentation
displayName: Append a link to Micronaut SourceGen Generator documentation
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://micronaut-projects.github.io/micronaut-sourcegen/latest/guide/
      appendNewline: true
