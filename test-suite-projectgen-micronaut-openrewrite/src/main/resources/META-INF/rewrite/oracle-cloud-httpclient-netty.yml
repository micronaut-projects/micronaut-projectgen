name: io.micronaut.starter.feature.oracle-cloud-httpclient-netty.micronaut.documentation
displayName: Append a link to Micronaut Oracle Cloud HttpClient Netty
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: RAEDME.md
