type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.microstream-annotations
displayName: Add Microstream Annotation dependency
recipeList:
  - io.micronaut.starter.feature.microstream-annotations.maven
  - io.micronaut.starter.feature.microstream-annotations.gradle
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.microstream-annotations.maven
displayName: Add Miocrostream annotations Processor to the Maven compiler plugin
recipeList:
  - org.openrewrite.maven.AddAnnotationProcessor:
      groupId: io.micronaut.microstream
      artifactId: micronaut-microstream-annotations
      version: ${micronaut.microstream.version}
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.microstream-annotations.gradle
displayName: Adds Microstream annotations Processor dependency to a Gradle Build
recipeList:
  - org.openrewrite.gradle.AddDependency:
      groupId: io.micronaut.microstream
      artifactId: micronaut-microstream-annotations
      configuration: annotationProcessor
