type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.multi-tenancy
displayName: Add Multitenancy dependency and link to README
recipeList:
  - io.micronaut.starter.feature.multi-tenancy.dependencies
  - io.micronaut.starter.feature.multi-tenancy.micronaut.documentation
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.multi-tenancy.dependencies
displayName: Add Multitenancy dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.multitenancy
      artifactId: micronaut-multitenancy
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.multi-tenancy.micronaut.documentation
displayName: Append link to Micronaut Multitenancy dependency
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://docs.micronaut.io/latest/guide/index.html#multitenancy
      appendNewline: true
      existingFileStrategy: Continue

