type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.security-csrf
displayName: Add Security Csrf dependency and link to README
recipeList:
  - io.micronaut.starter.feature.security-csrf.dependencies
  - io.micronaut.starter.feature.security-csrf.micronaut.documentation
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.security-csrf.dependencies
displayName: Add Security Csrf dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.security
      artifactId: micronaut-security-csrf
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.security-csrf.micronaut.documentation
displayName: Append a link to Micronaut Security Csrf documentation
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://micronaut-projects.github.io/micronaut-security/latest/guide/index.html#csrf
      appendNewline: true
      existingFileStrategy: Continue
