type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.cache-hazelcast
displayName: Add Cache Hazelcast dependency and link to README
recipeList:
  - io.micronaut.starter.feature.cache-hazelcast.dependencies
  - io.micronaut.starter.feature.create-application-properties
  - io.micronaut.starter.feature.cache-hazelcast.configurations
  - io.micronaut.starter.feature.cache-hazelcast.micronaut.documentation
  - io.micronaut.starter.feature.cache-hazelcast.documentation.thirdparty
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.cache-hazelcast.dependencies
displayName: Add Cache Hazelcast dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.cache
      artifactId: micronaut-cache-hazelcast
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.cache-hazelcast.micronaut.documentation
displayName: Append a link to Micronaut Cache Hazelcast documentation
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://micronaut-projects.github.io/micronaut-cache/latest/guide/index.html#hazelcast
      appendNewline: true
      existingFileStrategy: Continue
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.cache-hazelcast.documentation.thirdparty
displayName: Append a link to Cache Hazelcast Website
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://hazelcast.org/
      appendNewline: true
      existingFileStrategy: Continue
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.cache-hazelcast.configurations
displayName: Add Cache Hazelcast configuration
preconditions:
  - io.micronaut.starter.openrewrite.recipes.FindApplicationProperties
recipeList:
  - org.openrewrite.properties.AddProperty:
      property: hazelcast.network.addresses
      value: 121.0.0.1:5701

