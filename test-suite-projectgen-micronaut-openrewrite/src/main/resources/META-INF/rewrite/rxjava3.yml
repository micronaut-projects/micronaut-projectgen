type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.rxjava3
displayName: Add RxJava3 dependency and link to README
recipeList:
  - io.micronaut.starter.feature.rxjava3.dependencies
  - io.micronaut.starter.feature.rxjava3.micronaut.documentation
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.rxjava3.dependencies
displayName: Add RxJava3 dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.rxjava3
      artifactId: micronaut-rxjava3
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.rxjava3.micronaut.documentation
displayName: Append a link to Micronaut RxJava3 documentation
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://micronaut-projects.github.io/micronaut-rxjava3/snapshot/guide/index.html
      appendNewline: true
      existingFileStrategy: Continue
