type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.aws-secrets-manager
displayName: Add Aws Secrets Manager dependency and link to README
recipeList:
  - io.micronaut.starter.feature.aws-secrets-manager.dependencies
  - io.micronaut.starter.feature.aws-secrets-manager.configurations
  - io.micronaut.starter.feature.aws-secrets-manager.micronaut.documentation
  - io.micronaut.starter.feature.aws-secrets-manager.documentation.thirdparty
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.aws-secrets-manager.dependencies
displayName: Add Aws Secrets Manager Dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.aws
      artifactId: micronaut-aws-secretsmanager
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.aws-secrets-manager.configurations
displayName: Add Aws Secrets Manager Configuration
preconditions:
  - io.micronaut.starter.openrewrite.recipes.FindBootstrapProperties
recipeList:
  - org.openrewrite.properties.AddProperty:
      property: aws.distributed-configuration.search-active-environments
      value: false
  - org.openrewrite.properties.AddProperty:
      property: aws.client.system-manager.parameterstore.enabled
      value: true
  - org.openrewrite.properties.AddProperty:
      property: aws.distributed-configuration.search-common-application
      value: false
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.aws-secrets-manager.micronaut.documentation
displayName: Append a link to Micronaut Aws Secrets Manager Documentation
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://micronaut-projects.github.io/micronaut-aws/latest/guide/#distributedconfigurationsecretsmanager
      appendNewline: true
      existingFileStrategy: Continue
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.aws-secrets-manager.documentation.thirdparty
displayName: Append a link to Aws Secrets Manager Website
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://aws.amazon.com/secrets-manager/
      appendNewline: true
      existingFileStrategy: Continue

