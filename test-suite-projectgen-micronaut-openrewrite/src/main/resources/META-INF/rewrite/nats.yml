type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.nats
displayName: Add Nats dependency and link to README
recipeList:
  - io.micronaut.starter.feature.nats.dependencies
  - io.micronaut.starter.feature.nats.micronaut.documentation
  - io.micronaut.starter.feature.create-application-properties
  - io.micronaut.starter.feature.nats.configuration
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.nats.dependencies
displayName: Add Nats dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.nats
      artifactId: micronaut-nats
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.nats.micronaut.documentation
displayName: Append a link to Micronaut Nats documentation
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://micronaut-projects.github.io/micronaut-nats/snapshot/guide/
      appendNewline: true
      existingFileStrategy: Continue
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.nats.configuration
displayName: Add Nats Configuration
preconditions:
  - io.micronaut.starter.openrewrite.recipes.FindApplicationProperties
recipeList:
  - org.openrewrite.properties.AddProperty:
      property: nats.default.addresses
      value: nats://localhost:4222
