type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.jdbc-config-oracle
displayName: Add Jdbc Oracle configuration
recipeList:
  - io.micronaut.starter.feature.create-application-properties
  - io.micronaut.starter.feature.jdbc-config-oracle.config
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.jdbc-config-oracle.config
displayName: Add Jdbc Oracle configuration
preconditions:
  - io.micronaut.starter.openrewrite.recipes.FindApplicationProperties
recipeList:
  - org.openrewrite.properties.AddProperty:
      property: datasources.default.db-type
      value: oracle
  - org.openrewrite.properties.AddProperty:
      property: datasources.default.driver-class-name
      value: oracle.jdbc.OracleDriver

