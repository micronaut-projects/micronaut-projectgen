type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.neo4j-bolt
displayName: Add Neo4j Bolt dependency and link to README
recipeList:
  - io.micronaut.starter.feature.neo4j-bolt.dependencies
  - io.micronaut.starter.feature.neo4j-bolt.micronaut.documentation
  - io.micronaut.starter.feature.neo4j-bolt.configuration
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.neo4j-bolt.dependencies
displayName: Add Neo4j Bolt dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.neo4j
      artifactId: micronaut-neo4j-bolt
      configuration: implementation
      scope: compile
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: org.neo4j.test
      artifactId: neo4j-harness
      configuration: testRuntimeOnly
      scope: test
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.neo4j-bolt.micronaut.documentation
displayName: Append a link to Micronaut Neo4j Bolt documentation
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://micronaut-projects.github.io/micronaut-neo4j/latest/guide/index.html
      appendNewline: true
      existingFileStrategy: Continue
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.neo4j-bolt.configuration
displayName: Add Neo4j Bolt configuration
preconditions:
  - io.micronaut.starter.openrewrite.recipes.FindApplicationProperties
recipeList:
  - org.openrewrite.properties.AddProperty:
      property: neo4j.uri
      value: bolt://${NEO4J_HOST:localhost}
