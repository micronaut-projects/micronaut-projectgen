type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.tracing-opentelemetry-exporter-gcp
displayName: Add Tracing Opentelemetry Exporter GCP dependency and configuration
recipeList:
  - io.micronaut.starter.feature.tracing-opentelemetry-exporter-gcp.dependencies
  - io.micronaut.starter.feature.tracing-opentelemetry-exporter-gcp.configuration
  - io.micronaut.starter.feature.opentelemetry.documentation.thirdparty
  - io.micronaut.starter.feature.opentelemetry.micronaut.documentation
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.tracing-opentelemetry-exporter-gcp.dependencies
displayName: Add Tracing Opentelemetry Exporter GCP dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: com.google.cloud.opentelemetry
      artifactId: exporter-auto
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.tracing-opentelemetry-exporter-gcp.configuration
displayName: Add Tracing Opentelemetry Exporter GCP configuration
preconditions:
  - io.micronaut.starter.openrewrite.recipes.FindApplicationProperties
recipeList:
  - org.openrewrite.properties.AddProperty:
      property: otel.traces.exporter
      value: google_cloud_trace
