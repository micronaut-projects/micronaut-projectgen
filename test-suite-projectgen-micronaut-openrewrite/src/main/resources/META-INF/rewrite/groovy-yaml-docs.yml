type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.groovy-yaml-docs
displayName: Append a link to Groovy Yaml documentation
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://docs.groovy-lang.org/docs/latest/html/documentation/#_processing_yaml
      appendNewline: true
      existingFileStrategy: Continue
