type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.lombok-annotation
displayName: Add Lombok Annotation Processor
recipeList:
  - io.micronaut.starter.feature.lombok-annotation.maven
  - io.micronaut.starter.feature.lombok-annotation.gradle
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.lombok-annotation.maven
displayName: Add Lombok annotations Processor to the Maven compiler plugin
recipeList:
  - org.openrewrite.maven.AddAnnotationProcessor:
      groupId: org.projectlombok
      artifactId: lombok
      version: ${lombok.version}
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.lombok-annotation.gradle
displayName: Add Lombok annotations Processor dependency to a Gradle Build
recipeList:
  - org.openrewrite.gradle.AddDependency:
      groupId: org.projectlombok
      artifactId: lombok
      configuration: annotationProcessor
