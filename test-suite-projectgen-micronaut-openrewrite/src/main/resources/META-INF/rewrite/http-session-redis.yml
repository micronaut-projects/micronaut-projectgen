type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.http-session-redis
displayName: Add Http Session Configuration
preconditions:
  - io.micronaut.starter.openrewrite.recipes.FindApplicationProperties
recipeList:
  - org.openrewrite.properties.AddProperty:
      property: micronaut.session.http.redis.enabled
      value: true
