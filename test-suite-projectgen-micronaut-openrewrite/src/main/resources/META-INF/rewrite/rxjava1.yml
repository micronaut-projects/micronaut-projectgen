type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.rxjava1
displayName: Add Rxjava1 dependency and link to README
recipeList:
  - io.micronaut.starter.feature.rxjava1.dependencies
  - io.micronaut.starter.feature.rxjava1.micronaut.documentation
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.rxjava1.dependencies
displayName: Add Rxjava1 dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.rxjava1
      artifactId: micronaut-rxjava1
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.rxjava1.micronaut.documentation
displayName: Append a link to Micronaut Rxjava1 documentation
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://micronaut-projects.github.io/micronaut-rxjava1/latest/guide/index.html
      appendNewline: true
      existingFileStrategy: Continue
