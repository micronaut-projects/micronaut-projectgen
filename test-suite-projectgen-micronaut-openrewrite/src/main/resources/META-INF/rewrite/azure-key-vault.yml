type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.azure-key-vault
displayName: Add Azure Key Vault dependency and link to README
recipeList:
  - io.micronaut.starter.feature.azure-key-vault.dependencies
  - io.micronaut.starter.feature.azure-key-vault.micronaut.documentation
  - io.micronaut.starter.feature.azure-key-vault.documentation.thirdparty
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.azure-key-vault.dependencies
displayName: Add Azure Key Vault dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.azure
      artifactId: micronaut-azure-secret-manager
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.azure-key-vault.micronaut.documentation
displayName: Append a link to Micronaut Azure Key Vault documentation
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://micronaut-projects.github.io/micronaut-azure/latest/guide/#azureKeyVault
      appendNewline: true
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.azure-key-vault.documentation.thirdparty
displayName: Append a link to Azure Key Vault Website
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://azure.microsoft.com/en-us/services/key-vault/#product-overview
      appendNewline: true
