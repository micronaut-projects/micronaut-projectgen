type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.r2dbc-mysql
displayName: Add R2dbc Mysql dependency and  configuration
recipeList:
  - io.micronaut.starter.feature.r2dbc-mysql.dependencies
  - io.micronaut.starter.feature.create-application-properties
  - io.micronaut.starter.feature.r2dbc-mysql.config
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.r2dbc-mysql.dependencies
displayName: Add R2dbc Mysql dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.asyncer
      artifactId: r2dbc-mysql
      configuration: runtimeOnly
      scope: runtime
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.r2dbc-mysql.config
displayName: Add R2dbc Mysql driver configuration
preconditions:
  - io.micronaut.starter.openrewrite.recipes.FindApplicationProperties
recipeList:
  - org.openrewrite.properties.AddProperty:
      property: r2dbc.datasources.default.dialect
      value: MYSQL
  - org.openrewrite.properties.AddProperty:
      property: r2dbc.datasources.default.db-type
      value: mysql
