type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.asciidoctor-maven
displayName: Add Asciidoctor maven plugin and project properties
recipeList:
  - io.micronaut.starter.feature.asciidoctor-maven.properties
  - io.micronaut.starter.feature.asciidoctor-maven.plugin
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.asciidoctor-maven.properties
displayName: Add Asciidoctor project properties
recipeList:
  - org.openrewrite.maven.AddProperty:
      key: asciidoctor.maven.plugin.version
      value: 2.2.6
  - org.openrewrite.maven.AddProperty:
      key: asciidoctorj.version
      value: 2.5.13
  - org.openrewrite.maven.AddProperty:
      key: asciidoctorj.diagram.version
      value: 2.3.2
  - org.openrewrite.maven.AddProperty:
      key: jruby.version
      value: 9.4.13.0
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.asciidoctor-maven.plugin
displayName: Add Asciidoctor maven plugin
recipeList:
  - org.openrewrite.maven.AddPlugin:
      groupId: org.asciidoctor
      artifactId: asciidoctor-maven-plugin
      version: ${asciidoctor.maven.plugin.version}
      dependencies: <dependencies><dependency><groupId>org.asciidoctor</groupId><artifactId>asciidoctorj</artifactId><version>${asciidoctorj.version}</version></dependency><dependency><groupId>org.asciidoctor</groupId><artifactId>asciidoctorj-diagram</artifactId><version>${asciidoctorj.diagram.version}</version></dependency></dependencies>
      executions: <executions><execution><id>asciidoc-to-html</id><phase>generate-resources</phase><goals><goal>process-asciidoc</goal></goals><configuration><backend>html5</backend><sourceHighlighter>coderay</sourceHighlighter><attributes><imagesdir>./images</imagesdir><toc>left</toc><icons>font</icons><sectanchors>true</sectanchors><!-- set the idprefix to blank --><idprefix/><idseparator>-</idseparator><docinfo1>true</docinfo1></attributes></configuration></execution></executions>
      configuration: <configuration><sourceDirectory>src/docs/asciidoc</sourceDirectory><requires><require>asciidoctor-diagram</require></requires><!-- Attributes common to all output formats --><attributes><endpoint-url>https://example.org</endpoint-url><sourcedir>${project.build.sourceDirectory}</sourcedir><project-version>${project.version}</project-version></attributes></configuration>

