type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.eclipse-store
displayName: Add EclipseStore dependency and link to README
recipeList:
  - io.micronaut.starter.feature.eclipse-store.dependencies
  - io.micronaut.starter.feature.eclipse-store-annotation
  - io.micronaut.starter.feature.eclipse-store.micronaut.documentation
  - io.micronaut.starter.feature.eclipse-store.documentation.thirdparty
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.eclipse-store.dependencies
displayName: Add EclipseStore dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.eclipsestore
      artifactId: micronaut-eclipsestore
      configuration: implementation
      scope: compile
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.eclipsestore
      artifactId: micronaut-eclipsestore-annotations
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.eclipse-store.micronaut.documentation
displayName: Append a link to Micronaut EclipseStore documentation
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://micronaut-projects.github.io/micronaut-eclipsestore/latest/guide
      appendNewline: true
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.eclipse-store.documentation.thirdparty
displayName: Append a link to EclipseStore website
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://docs.eclipsestore.io/
      appendNewline: true
