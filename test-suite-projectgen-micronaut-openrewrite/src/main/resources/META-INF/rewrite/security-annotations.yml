type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.security-annotations
displayName: Add Security Annotations dependency
recipeList:
  - io.micronaut.starter.feature.security-annotations.maven
  - io.micronaut.starter.feature.security-annotations.gradle
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.security-annotations.maven
displayName: Add Security annotations to the Maven compiler plugin
recipeList:
  - org.openrewrite.maven.AddAnnotationProcessor:
      groupId: io.micronaut.security
      artifactId: micronaut-security-annotations
      version: ${micronaut.security.version}
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.security-annotations.gradle
displayName:  Add Security annotations dependency to a Gradle Build
recipeList:
  - org.openrewrite.gradle.AddDependency:
      groupId: io.micronaut.security
      artifactId: micronaut-security-annotations
      configuration: annotationProcessor
