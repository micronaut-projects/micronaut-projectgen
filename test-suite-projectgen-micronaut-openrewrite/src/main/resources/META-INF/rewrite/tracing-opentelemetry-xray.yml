type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.tracing-opentelemetry-xray
displayName: Add Tracing Opentelemetry Xray dependency and configuration
recipeList:
  - io.micronaut.starter.feature.tracing-opentelemetry-xray.dependencies
  - io.micronaut.starter.feature.tracing-opentelemetry-xray.configuration
  - io.micronaut.starter.feature.tracing-opentelemetry-xray.documentation.thirdparty
  - io.micronaut.starter.feature.opentelemetry.documentation.thirdparty
  - io.micronaut.starter.feature.opentelemetry.micronaut.documentation
  - io.micronaut.starter.feature.tracing-opentelemetry-exporter-otlp
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.tracing-opentelemetry-xray.dependencies
displayName: Add Tracing Opentelemetry Xray dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.opentelemetry.contrib
      artifactId: opentelemetry-aws-resources
      configuration: implementation
      scope: compile
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.opentelemetry.contrib
      artifactId: opentelemetry-aws-xray
      configuration: implementation
      scope: compile
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.opentelemetry.contrib
      artifactId: opentelemetry-aws-xray-propagator
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.tracing-opentelemetry-xray.configuration
displayName: Add Tracing Opentelemetry Xray configuration
preconditions:
  - io.micronaut.starter.openrewrite.recipes.FindApplicationProperties
recipeList:
  - org.openrewrite.properties.AddProperty:
      property: otel.traces.propagator
      value: tracecontext, baggage, xray
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.tracing-opentelemetry-xray.documentation.thirdparty
displayName: Append a link to Xray Website
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://docs.aws.amazon.com/xray/latest/devguide/aws-xray.html
      appendNewline: true
      existingFileStrategy: Continue
