type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.rss-itunes-podcast
displayName: Add Rss Itunes Podcast dependency and link to README
recipeList:
  - io.micronaut.starter.feature.rss-itunes-podcast.dependencies
  - io.micronaut.starter.feature.rss-itunes-podcast.micronaut.documentation
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.rss-itunes-podcast.dependencies
displayName: Add Rss Itunes Podcast dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.rss
      artifactId: micronaut-itunespodcast
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.rss-itunes-podcast.micronaut.documentation
displayName: Append a link to Micronaut Rss Itunes Podcast documentation
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://micronaut-projects.github.io/micronaut-rss/latest/guide/index.html#itunespodcast
      appendNewline: true
      existingFileStrategy: Continue
