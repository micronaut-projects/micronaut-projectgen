type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.dekorate-halkyon
displayName: Add Dekorate Halkyon Dependency and link to README
recipeList:
  - io.micronaut.starter.feature.dekorate-halkyon.dependencies
  - io.micronaut.starter.feature.dekorate-halkyon.documentation.thirdparty
  - io.micronaut.starter.feature.halkyon-annotations
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.dekorate-halkyon.dependencies
displayName: Add Dekorate Halkyon Dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.dekorate
      artifactId: halkyon-annotations
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.dekorate-halkyon.documentation.thirdparty
displayName: Append a link to Dekorate Halkyon documentation
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://github.com/dekorateio/dekorate#halkyon-crd
      appendNewline: true

