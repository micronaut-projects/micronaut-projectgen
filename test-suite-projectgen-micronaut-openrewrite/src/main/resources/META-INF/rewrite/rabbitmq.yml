type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.rabbitmq
displayName: Add Rabbitmq dependency and link to README
recipeList:
  - io.micronaut.starter.feature.rabbitmq.dependencies
  - io.micronaut.starter.feature.rabbitmq.micronaut.documentation
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.rabbitmq.dependencies
displayName: Add Rabbitmq dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.rabbitmq
      artifactId: micronaut-rabbitmq
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.rabbitmq.micronaut.documentation
displayName: Append a link to Micronaut Rabbitmq documentation
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://micronaut-projects.github.io/micronaut-rabbitmq/latest/guide/index.html
      appendNewline: true
