---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.email-javamail.dependencies
displayName: Add Email-javamail dependency
recipeList:
  - org.openrewrite.java.dependencies.AddDependency:
      groupId: io.micronaut.email
      artifactId: micronaut-email-javamail
      configuration: implementation
      scope: compile
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.email-javamail.documentation.micronaut
displayName: Append link to Micronaut Email Javamail documentation
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://micronaut-projects.github.io/micronaut-email/latest/guide/index.html#javamail
      appendNewline: true
---
type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.email-javamail.documentation.thirdparty
displayName: Append link to Jakarta Mail Specification
recipeList:
  - org.openrewrite.text.AppendToTextFile:
      relativeFileName: README.md
      content: https://jakartaee.github.io/mail-api/
      appendNewline: true

