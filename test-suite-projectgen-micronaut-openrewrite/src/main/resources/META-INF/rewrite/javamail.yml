type: specs.openrewrite.org/v1beta/recipe
name: io.micronaut.starter.feature.email-javamail
displayName: Add Email-javamail dependency and link to README
recipeList:
  - io.micronaut.starter.feature.email-javamail.dependencies
  - io.micronaut.starter.feature.email-javamail.documentation.thirdparty
